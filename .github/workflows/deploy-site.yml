# Deploys the HeavyMap site to heavymap.com (spec G section 4).
#
# Manual only: Actions > "Deploy heavymap.com" > Run workflow. Morgen starts
# it and approves the `heavymap-public` environment; agents never do
# (HARD-RULES 3 and 7). Needs Settings > Pages > Source: GitHub Actions.
# Every build check runs first (spec G section 2); a failure stops the deploy.
name: Deploy heavymap.com

on:
  workflow_dispatch:
    inputs:
      launch_gates:
        description: "Run the launch gates (all themes published, signup configured)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: heavymap-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build with every check
        run: node build/prerender.mjs ${{ inputs.launch_gates && '--launch' || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: heavymap-public
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
