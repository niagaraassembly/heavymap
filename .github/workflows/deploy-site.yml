# Deploys the HeavyMap site to heavymap.com (spec G section 4).
#
# SOLO-PREVIEW MODE (D-073, 2026-11-16): a push to main that touches web/ or
# this workflow deploys to heavymap.com with no approval click. Morgen pushes
# main, or approves an agent's push to main, one push at a time. The manual
# run below is kept for redeploys. Every build check runs first (spec G
# section 2) and push runs always use the launch gates; a failure stops the
# deploy and the previous site stays up. Needs Settings > Pages > Source:
# GitHub Actions. Process and the switch back to team mode: docs/DEPLOY.md.
name: Deploy heavymap.com

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
    inputs:
      launch_gates:
        description: "Run the launch gates (all themes published, signup configured)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: heavymap-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Industrial Atlas release
        uses: actions/checkout@v4
        with:
          repository: niagaraassembly/industrial-atlas-data
          ref: ca-on-hamilton-2026-11-16-d070
          path: industrial-atlas-data
      - name: Check out the pinned Hamilton map-layer release
        uses: actions/checkout@v4
        with:
          repository: niagaraassembly/industrial-atlas-data
          # Pin the immutable commit containing map-releases/.../layer-set-002.
          ref: 8fe8bdf846defe4451a17ee6a41d949b3ba859be
          path: industrial-atlas-map-layers
      - name: Refuse a map-layer pin that is not a full commit hash
        working-directory: .
        run: |
          grep -Eq '^\s+ref: [0-9a-f]{40}$' <(sed -n '/Check out the pinned Hamilton map-layer release/,/path:/p' .github/workflows/deploy-site.yml) \
            || { echo "Map-layer release ref must be a 40-character commit SHA"; exit 1; }
      - name: Check out the pinned Hamilton development data release
        uses: actions/checkout@v4
        with:
          repository: niagaraassembly/industrial-atlas-data
          # Immutable screened package commit; its manifest verifies all output hashes.
          ref: b0e184768ab140340fe1c63fb731759809f046d7
          path: industrial-atlas-development
      - name: Check out the pinned parcel access release (private portrait store, D-079)
        uses: actions/checkout@v4
        with:
          repository: niagaraassembly/heavymap-portraits
          # Immutable commit; the build verifies every shard hash against the manifest.
          ref: 50f153fabf2cae2202a411a837ee4e38014b0e9f
          path: heavymap-portraits
          # Read-only deploy key for that one private repository.
          ssh-key: ${{ secrets.PORTRAITS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Refuse a portrait pin that is not a full commit hash
        working-directory: .
        run: |
          grep -Eq '^\s+ref: [0-9a-f]{40}$' <(sed -n '/Check out the pinned parcel access release/,/path:/p' .github/workflows/deploy-site.yml) \
            || { echo "Portrait release ref must be a 40-character commit SHA"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build with every check
        env:
          HM_ATLAS_RELEASE_DIR: ${{ github.workspace }}/industrial-atlas-data/releases/ca-on-hamilton/2026-11-16-d070
          HM_MAP_LAYER_RELEASE_DIR: ${{ github.workspace }}/industrial-atlas-map-layers/map-releases/ca-on-hamilton/2026-11-17-layer-set-002
          HM_DEVELOPMENT_RELEASE_DIR: ${{ github.workspace }}/industrial-atlas-development/development-releases/ca-on-hamilton/2026-11-17-field-screen-v0.3
          HM_ACCESS_RELEASE_DIR: ${{ github.workspace }}/heavymap-portraits/access-releases/ca-on-hamilton/2026-11-17-access-v0.1
        run: node build/prerender.mjs ${{ (github.event_name == 'push' || inputs.launch_gates) && '--launch' || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: heavymap-public
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Record the deploy
        env:
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEVELOPMENT_REF: b0e184768ab140340fe1c63fb731759809f046d7
        run: |
          {
            echo "### Deployed heavymap.com"
            echo "- Commit: \`$SHA\` on \`$REF_NAME\`"
            echo "- Trigger: $EVENT by $ACTOR"
            echo "- Atlas release: ca-on-hamilton/2026-11-16-d070"
            echo "- Map layer release: ca-on-hamilton/2026-11-17-layer-set-002"
            echo "- Development release: ca-on-hamilton/2026-11-17-field-screen-v0.3 (data commit $DEVELOPMENT_REF)"
            echo "- URL: $PAGE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
